name = "workers-immich"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# [build]
# command = "cd ../web && npm run build"

[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/.well-known/*", "/custom.css"]

[[d1_databases]]
binding = "DB"
database_name = "immich"
database_id = "62e02b2c-47b5-41ee-bf50-17055164f318"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "immich"

[[kv_namespaces]]
binding = "KV"
id = "0a37ab56cc5f4d50831e6cb54ef1242e"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[vars]
ENVIRONMENT = "production"
